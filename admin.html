<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC | Fraud Ops Center</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --text-mute: #94a3b8;
            --accent: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }

        header {
            display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 30px;
        }
        h1 { margin: 0; font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        
        .live-indicator {
            display: flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; color: var(--success); background: rgba(16, 185, 129, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .pulse { width: 6px; height: 6px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }

        .table-container {
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { 
            text-align: left; padding: 16px; background: #0f172a; color: var(--text-mute); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border);
        }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }
        
        /* Badges */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
        .badge.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .badge.warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge.safe { background: rgba(16, 185, 129, 0.15); color: var(--success); }

        .otp-pill {
            font-family: 'JetBrains Mono', monospace; background: var(--accent); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.85rem; letter-spacing: 1px;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h1>
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            Security Operations Center
        </h1>
        <div class="live-indicator"><div class="pulse"></div> LIVE FEED</div>
    </header>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>User Identity</th>
                    <th>Location (Lat, Lon)</th>
                    <th>Generated OTP</th>
                    <th>Risk Score</th>
                    <th>System Decision</th>
                </tr>
            </thead>
            <tbody id="log-table">
                <tr><td colspan="6" style="text-align:center; padding: 40px; color: var(--text-mute);">Connecting to Fusion Engine...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchLogs() {
            try {
                const res = await fetch('https://financial-fraud-ews.onrender.com/admin/data');
                const data = await res.json();
                const logs = data.logs;
                const tbody = document.getElementById('log-table');

                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px; color: #94a3b8;">No activity logs found.</td></tr>';
                    return;
                }

                tbody.innerHTML = ''; 

                logs.forEach(log => {
                    const row = document.createElement('tr');
                    
                    let riskBadge = 'safe';
                    if (log.status === 'danger') riskBadge = 'danger';
                    if (log.status === 'warning') riskBadge = 'warning';

                    let otpDisplay = '<span style="color:#64748b; font-style:italic;">-</span>';
                    if (log.otp && log.otp !== "BLOCKED" && log.otp.length >= 4) {
                        otpDisplay = `<span class="otp-pill">${log.otp}</span>`;
                    } else if (log.otp === "BLOCKED") {
                        otpDisplay = `<span style="color:#ef4444; font-weight:bold;">BLOCKED</span>`;
                    }

                    row.innerHTML = `
                        <td style="color: var(--text-mute); font-family: 'JetBrains Mono', monospace;">${log.time}</td>
                        <td style="font-weight: 600;">${log.user}</td>
                        <td style="color: var(--text-mute);">${log.location}</td>
                        <td>${otpDisplay}</td>
                        <td><span class="badge ${riskBadge}">${log.risk}</span></td>
                        <td style="color: ${riskBadge === 'danger' ? '#ef4444' : riskBadge === 'warning' ? '#f59e0b' : '#10b981'}">${log.action}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (e) { console.error("Data Fetch Error:", e); }
        }
        setInterval(fetchLogs, 2000);
        fetchLogs(); 
    </script>
</body>
</html>
