<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Bank Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        
        h2 { color: #1a202c; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        
        .hidden { display: none; }
        #status { margin-top: 20px; font-weight: bold; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
        
        .error { background-color: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }
        .success { background-color: #f0fff4; color: #2f855a; border: 1px solid #c6f6d5; }
        .warning { background-color: #fffff0; color: #b7791f; border: 1px solid #fbd38d; }
        
        .info-text { font-size: 12px; color: #718096; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Global Bank</h2>
        
        <div id="login-form">
            <input type="text" id="username" placeholder="Username (e.g., demo_user)">
            <input type="password" id="password" placeholder="Password">
            <button onclick="handleLogin()">Log In</button>
            <p class="info-text">Protected by AI Fraud Detection</p>
        </div>

        <div id="otp-form" class="hidden">
            <h3>⚠️ Security Check</h3>
            <p style="font-size: 0.9rem; color: #4a5568;">Unusual activity detected. Please verify your identity.</p>
            <input type="text" id="otp" placeholder="Enter OTP (1234)">
            <button onclick="handleOTP()">Verify OTP</button>
        </div>

        <div id="status" class="hidden"></div>
    </div>

    <script>
        // --- HANDLERS ---

        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const statusDiv = document.getElementById('status');
            const loginForm = document.getElementById('login-form');
            const otpForm = document.getElementById('otp-form');

            // Reset UI
            statusDiv.className = "hidden";
            statusDiv.innerText = "";

            if (!user) {
                showStatus("Please enter a username", "error");
                return;
            }

            // Show loading state
            statusDiv.innerText = "Analyzing Risk Profile...";
            statusDiv.className = "warning";
            statusDiv.classList.remove("hidden");

            try {
                // 1. Call the PREDICT Endpoint
                const res = await fetch('https://financial-fraud-ews.onrender.com/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: user,
                        password: pass,
                        ip_address: "192.168.1.1",     // Simulated for prototype
                        device_fingerprint: "chrome_win10" // Simulated for prototype
                    })
                });

                if (!res.ok) {
                    throw new Error("Server Error or User Not Found");
                }

                const data = await res.json();
                const action = data.security_action;

                // 2. Handle the Security Action
                if (action.includes("BLOCK")) {
                    // CASE: Block
                    showStatus(action, "error");
                
                } else if (action.includes("FLAG") || action.includes("CHALLENGE")) {
                    // CASE: Challenge (Show OTP)
                    loginForm.classList.add("hidden");
                    otpForm.classList.remove("hidden");
                    showStatus(action, "warning");
                
                } else if (action.includes("Email")) {
                     // CASE: Impersonation (Show Warning but Allow or Ask for Info)
                     showStatus(action + " - Please check your inbox.", "warning");

                } else {
                    // CASE: Allow
                    showStatus("Login Successful! Redirecting...", "success");
                    // setTimeout(() => window.location.href = "/dashboard", 1000); // Redirect logic
                }

            } catch (e) {
                console.error(e);
                showStatus("Error: " + e.message, "error");
            }
        }

        function handleOTP() {
            const otp = document.getElementById('otp').value;
            
            // Since we don't have a backend OTP endpoint in the prototype, 
            // we simulate the verification here.
            if (otp === "1234") {
                document.getElementById('otp-form').classList.add("hidden");
                showStatus("Identity Verified. Login Successful!", "success");
            } else {
                alert("Invalid OTP. Try '1234'");
            }
        }

        function showStatus(message, type) {
            const el = document.getElementById('status');
            el.innerText = message;
            el.className = type; // Apply class (error, success, warning)
            el.classList.remove("hidden");
        }
    </script>
</body>
</html>
