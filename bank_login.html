<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Bank Login</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        #status { margin-top: 15px; font-weight: bold; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Global Bank</h2>
        
        <div id="login-form">
            <input type="text" id="username" placeholder="Username (user)">
            <input type="password" id="password" placeholder="Password (password123)" onkeyup="trackTyping()">
            <button onclick="handleLogin()">Log In</button>
            <p style="font-size:12px; color:#666;">Allow Location Access for Security Check</p>
        </div>

        <div id="otp-form" class="hidden">
            <h3>Identity Verification</h3>
            <p>Enter the code sent to your device.</p>
            <input type="text" id="otp" placeholder="Enter OTP (1234)">
            <button onclick="handleOTP()">Verify</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        // --- REAL LIFE SENSORS ---
        let keystrokes = [];
        let lastKeyTime = 0;

        // 1. Keystroke Dynamics Tracker
        function trackTyping() {
            const now = Date.now();
            if (lastKeyTime !== 0) {
                const delay = (now - lastKeyTime) / 1000; // Convert to seconds
                keystrokes.push(delay);
            }
            lastKeyTime = now;
        }

        function getAvgTypingSpeed() {
            if (keystrokes.length === 0) return 0.0; // Bot/Paste behavior
            const sum = keystrokes.reduce((a, b) => a + b, 0);
            return sum / keystrokes.length;
        }

        // 2. Geolocation Tracker
        function getPosition() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) resolve({coords: {latitude: 0, longitude: 0}});
                navigator.geolocation.getCurrentPosition(resolve, (err) => {
                    console.warn("Location denied, using default");
                    resolve({coords: {latitude: 28.7041, longitude: 77.1025}}); // Default fallback
                });
            });
        }

        // --- HANDLERS ---

        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const status = document.getElementById('status');
            const avgSpeed = getAvgTypingSpeed();

            status.innerText = "Analyzing Biometrics & Location...";
            
            // Get Real Location
            const pos = await getPosition();
            
            try {
                // CHANGE URL TO YOUR RENDER URL IF NEEDED
                const res = await fetch('http://127.0.0.1:8000/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: user,
                        password: pass,
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        avg_keystroke_delay: avgSpeed
                    })
                });
                
                const data = await res.json();
                
                if (data.status === "MFA_REQUIRED") {
                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('otp-form').classList.remove('hidden');
                    status.innerText = "";
                } else {
                    status.innerText = data.message;
                    status.className = "error";
                }
            } catch (e) { console.error(e); status.innerText = "Connection Error"; }
        }

        async function handleOTP() {
            const otp = document.getElementById('otp').value;
            const user = document.getElementById('username').value;
            const status = document.getElementById('status');

            try {
                const res = await fetch('http://127.0.0.1:8000/verify-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: user, otp_code: otp })
                });

                const data = await res.json();
                
                status.innerText = data.message;
                status.className = data.status === "SUCCESS" ? "success" : "error";
                
                if (data.status === "SUCCESS") {
                    setTimeout(() => alert("Welcome to Dashboard!"), 500);
                }
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
