<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global Bank | Secure Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; }
        
        .container { text-align: center; width: 90%; max-width: 800px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 800; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 16px; transition: all 0.3s; cursor: pointer; text-decoration: none; color: white;
        }
        .card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
        
        .icon { font-size: 2rem; margin-bottom: 15px; display: block; }
        .card h3 { margin: 0 0 10px 0; font-size: 1.25rem; }
        .card span { font-size: 0.9rem; color: #94a3b8; }

        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Global Bank Secure Portal</h1>
        <p>Select your access portal below</p>

        <div class="grid">
            <a href="https://ubiquitous-custard-a8e0cc.netlify.app/" class="card" target="_blank">
                <span class="icon">🏦</span>
                <h3>Client Banking</h3>
                <span>Secure access for customers</span>
            </a>
            
            <a href="https://guileless-rabanadas-0d4e65.netlify.app/" class="card", target="_blank">
                <span class="icon">🛡️</span>
                <h3>Security Ops Center</h3>
                <span>Admin monitoring dashboard</span>
            </a>
        </div>
    </div>
</body>
</html>
