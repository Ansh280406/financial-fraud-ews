<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Fraud Guard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3182ce; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2b6cb0; }
        #status { margin-top: 20px; padding: 10px; border-radius: 6px; font-weight: bold; display: none; }
        .error { background: #fed7d7; color: #c53030; }
        .success { background: #c6f6d5; color: #2f855a; }
        .warning { background: #feebc8; color: #b7791f; }
        .sensor-data { font-size: 0.8rem; color: #718096; margin-top: 15px; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏦 Secure Login</h2>
        <p style="color:#718096; font-size:0.9rem;">AI is analyzing your behavior & location.</p>
        
        <input type="text" id="username" placeholder="Username (Try: demo_user)">
        <input type="password" id="password" placeholder="Password" onkeyup="measureTyping()">
        
        <button onclick="attemptLogin()">Log In</button>
        
        <div class="sensor-data">
            <div>⌨️ Typing Delay: <span id="disp-typing">0</span> ms</div>
            <div>🌍 Location: <span id="disp-loc">Detecting...</span></div>
        </div>

        <div id="status"></div>
    </div>

    <script>
        // --- SENSOR VARIABLES ---
        let lastKeyTime = 0;
        let delays = [];
        let userLat = 0.0;
        let userLon = 0.0;

        // 1. Get Real Location immediately
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    document.getElementById('disp-loc').innerText = `${userLat.toFixed(2)}, ${userLon.toFixed(2)}`;
                },
                (err) => {
                    document.getElementById('disp-loc').innerText = "Blocked/Unknown (Using 0,0)";
                }
            );
        }

        // 2. Measure Typing Speed (Keystroke Dynamics)
        function measureTyping() {
            const now = Date.now();
            if (lastKeyTime !== 0) {
                const diff = now - lastKeyTime;
                delays.push(diff);
                // Update UI average
                const avg = Math.round(delays.reduce((a,b)=>a+b,0) / delays.length);
                document.getElementById('disp-typing').innerText = avg;
            }
            lastKeyTime = now;
        }

        // 3. Send to AI
        async function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const status = document.getElementById('status');
            
            // Calculate Average Delay (Default 0 for bots/paste)
            let avgDelay = 0;
            if (delays.length > 0) {
                avgDelay = delays.reduce((a, b) => a + b, 0) / delays.length;
            }

            status.style.display = 'block';
            status.innerText = "🔄 Processing with AI Fusion...";
            status.className = "warning";

            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user,
                        password: pass,
                        latitude: userLat,
                        longitude: userLon,
                        typing_delay: avgDelay,
                        device_fingerprint: "browser_v1"
                    })
                });

                const data = await res.json();
                
                status.innerText = `${data.security_action}`;
                
                if (data.security_action.includes("BLOCK")) status.className = "error";
                else if (data.security_action.includes("ALLOW")) status.className = "success";
                else status.className = "warning";

            } catch (e) {
                status.innerText = "Error: " + e.message;
                status.className = "error";
            }
        }
    </script>
</body>
</html>
